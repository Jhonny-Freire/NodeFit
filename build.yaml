# Dois alvos de build, porque o riverpod_generator precisa enxergar os tipos
# que o Drift gera (Exercise, Gym, ...). O alvo `drift` roda primeiro e
# gera o banco; o alvo padrão (Riverpod) depende dele.
targets:
  drift:
    auto_apply_builders: false
    sources:
      - lib/core/db/app_database.dart
      - lib/core/db/tables.dart
      - lib/core/domain/**
      - lib/core/utils/**
    builders:
      drift_dev:preparing_builder:
        enabled: true
      drift_dev:
        enabled: true
        options:
          # Datas gravadas como texto ISO-8601 (legível no backup e com ms).
          store_date_time_values_as_text: true
          # Usados pelo `dart run drift_dev make-migrations` quando o schema mudar.
          databases:
            nodefit: lib/core/db/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
      source_gen:combining_builder:
        enabled: true

  $default:
    dependencies:
      - ":drift"
    sources:
      exclude:
        - lib/core/db/app_database.dart
        - lib/core/db/tables.dart
        - lib/core/domain/**
        - lib/core/utils/**
    builders:
      drift_dev:
        enabled: false
